{
  "controller_manager": {
    "ros__parameters": {
      "update_rate": 100,
      "use_sim_time": true,
      "enforce_command_limits": true,
      "joint_state_broadcaster": {
        "type": "joint_state_broadcaster/JointStateBroadcaster"
      },
      "diff_drive_controller": {
        "type": "diff_drive_controller/DiffDriveController"
      }
    }
  },
  "diff_drive_controller": {
    "ros__parameters": {
      "left_wheel_names": [
        "left_wheel_joint"
      ],
      "right_wheel_names": [
        "right_wheel_joint"
      ],
      "wheel_separation": 0.58,
      "wheel_radius": 0.12,
      "base_frame_id": "base_link",
      "odom_frame_id": "odom",
      "enable_odom_tf": true,
      "position_feedback": true,
      "open_loop": false,
      "publish_rate": 50.0,
      "cmd_vel_timeout": 0.5,
      "pose_covariance_diagonal": [
        0.001,
        0.001,
        0.001,
        0.001,
        0.001,
        0.01
      ],
      "twist_covariance_diagonal": [
        0.001,
        0.001,
        0.001,
        0.001,
        0.001,
        0.01
      ],
      "linear.x.max_velocity": 0.7,
      "linear.x.min_velocity": -0.7,
      "linear.x.max_acceleration": 0.5,
      "linear.x.max_deceleration": -0.5,
      "angular.z.max_velocity": 1.5,
      "angular.z.min_velocity": -1.5,
      "angular.z.max_acceleration": 1.5,
      "angular.z.max_deceleration": -1.5
    }
  }
}
