amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.1
    alpha4: 0.2
    alpha5: 0.1
    laser_model_type: likelihood_field
    laser_min_range: 0.08
    laser_max_range: 20.0
    laser_likelihood_max_dist: 2.0
    max_beams: 90
    min_particles: 500
    max_particles: 2500
    pf_err: 0.03
    pf_z: 0.99
    z_hit: 0.8
    z_rand: 0.2
    sigma_hit: 0.15
    update_min_d: 0.10
    update_min_a: 0.05
    resample_interval: 1
    transform_tolerance: 0.5
    tf_broadcast: true
    set_initial_pose: false
    always_reset_initial_pose: true
    save_pose_rate: 0.5
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
